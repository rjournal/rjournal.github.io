<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1702" viewBox="0 0 1700 1702">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Liberation Serif", "Times New Roman", serif; fill: black; }
    .lbl { font-size: 60px; text-anchor: middle; }
    .ital { font-style: italic; }
  </style>

  <!-- vertical connector line -->
  <line x1="300" y1="280" x2="300" y2="1422" stroke="black" stroke-width="7"/>

  <!-- branch arrows -->
  <line x1="300" y1="580" x2="895" y2="580" stroke="black" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="300" y1="1020" x2="895" y2="1020" stroke="black" stroke-width="7" marker-end="url(#arrow)"/>

  <!-- Total population (rounded box) -->
  <rect x="40" y="40" width="520" height="240" rx="40" ry="40" fill="none" stroke="black" stroke-width="7"/>
  <text class="lbl" x="300" y="140">Total</text>
  <text class="lbl" x="300" y="210">population</text>

  <!-- Subpopulation with I_S = 1 (rounded box) -->
  <rect x="40" y="1422" width="520" height="240" rx="40" ry="40" fill="none" stroke="black" stroke-width="7"/>
  <text class="lbl" x="300" y="1522">Subpopulation</text>
  <text class="lbl" x="300" y="1600">
    <tspan>with </tspan><tspan class="ital">I</tspan><tspan class="ital" dy="16" font-size="40px">S</tspan><tspan dy="-16"> = 1</tspan>
  </text>

  <!-- Exclude terminations (square box) -->
  <rect x="900" y="460" width="560" height="240" fill="none" stroke="black" stroke-width="7"/>
  <text class="lbl" x="1180" y="560">Exclude</text>
  <text class="lbl" x="1180" y="630">terminations</text>

  <!-- Exclude private hospitals (square box) -->
  <rect x="900" y="900" width="560" height="240" fill="none" stroke="black" stroke-width="7"/>
  <text class="lbl" x="1180" y="1000">Exclude</text>
  <text class="lbl" x="1180" y="1070">private hospitals</text>
</svg>
